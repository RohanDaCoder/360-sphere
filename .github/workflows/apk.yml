name: Release APK

# Builds a signed release APK on every commit (artifact attached to the run).
# Pushing a version tag (v*) additionally publishes a GitHub Release with the APK.
#
# Optional release signing — set these repository secrets and the APK is signed
# with your own keystore instead of the debug key:
#   ANDROID_KEYSTORE_BASE64   base64 of your .keystore/.jks file
#   ANDROID_STORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
#
# Create one with:
#   keytool -genkey -v -keystore release.keystore -alias sphere360 \
#     -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 release.keystore   # paste as ANDROID_KEYSTORE_BASE64

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Decode release keystore (skipped when secrets are absent)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the repository release keystore."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building with debug signing."
          fi

      - name: Build release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APK_NAME="sphere360-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="sphere360-v${VERSION}-${SHORT_SHA}.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "Built ${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/app/outputs/flutter-apk/${APK_NAME}" \
            --title "360Sphere ${GITHUB_REF_NAME}" \
            --generate-notes
