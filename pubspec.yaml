name: sphere360
description: "360Sphere — capture, stitch and share 360° photospheres. A clean-room Flutter recreation of the 360 Photo Cam app architecture."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera capture
  camera: ^0.12.2
  # Runtime camera permission request (the manifest declaration alone does
  # not show the OS dialog; without it the camera preview stays black)
  permission_handler: ^12.0.1

  # IMU sensors for gyro-guided stitching
  sensors_plus: ^7.1.1

  # 360° photo viewer (Photo Sphere Viewer in a WebView, like the original app)
  webview_flutter: ^4.10.0

  # Sharing and saving to the device gallery
  share_plus: ^13.3.1
  gal: ^2.3.0

  # Importing existing 360° photos from the device gallery
  image_picker: ^1.1.2

  # Google Maps / Street View publishing
  google_sign_in: ^7.2.0
  geolocator: ^14.1.2
  http: ^1.2.2

  # Opening the Street View share link (the original's Google Maps button)
  url_launcher: ^6.3.1

  # Persistence and state
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  provider: ^6.1.2

  # Image decoding / JPEG encoding of stitched spheres
  image: ^4.3.0

  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/viewer/
    - assets/viewer/js/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
